plugins {
    id 'com.android.application'
}

android {
    compileSdk 33
    defaultConfig {
        applicationId 'pk.paysys.tap2pay.postagtest'
        minSdk 23
        targetSdk 33
        versionCode 1
        versionName '0.1-poc'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation project(':core')
}
