plugins {
    id 'com.android.application'
}

android {
    compileSdk 33
    defaultConfig {
        applicationId 'pk.paysys.tap2pay.posreadertest'
        minSdk 26
        targetSdk 30
        versionCode 1
        versionName '0.1-poc'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation project(':core')
    // Urovo SDK (RFCardHandlerImpl -> android.device.PiccManager), copied from urovo-i9100/unionpay/libs
    implementation files('libs/urovosdkLibs_New_v1.0.14.aar')
}
